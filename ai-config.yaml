version: 1

# Host directory containing GGUF model files for `lala serve`.
model_dir: "D:\\models"

# Default work model used when a request does not include "model".
default_work_model: "mistral-work"
database:
  user: "lala"
  password: "lala"
  name: "lala_db"

# Vector store configuration.
chroma:
  mode: embedded
  path: ./chroma_db
  host: localhost
  port: 8000
  collection_name: lala_vectors

# Chat/classification models. These are loaded on demand, one at a time.
work_models:
  - name: "mistral-work"
    model_path: "/models/qwen2.5-3b-instruct-q4_k_m.gguf"
    params:
      temperature: 0.7
      max_tokens: 4000
      n_gpu_layers: 0
      n_threads: 0
      n_threads_batch: 0
      n_ctx: 16000
      n_batch: 512
      use_mlock: 1

  - name: "deepseek-work"
    model_path: "/models/deepseek-coder-1.3b-instruct.Q4_K_M.gguf"
    params:
      temperature: 0.7
      max_tokens: 4000
      n_gpu_layers: 0
      n_threads: 0
      n_threads_batch: 0
      n_ctx: 8192
      n_batch: 512
      use_mlock: 1

# Embedding model. Loaded only for embedding requests.
embedding_model:
  name: "bge-embedding"
  model_path: "/models/bge-small-en-v1.5-q4_k_m.gguf"
  params:
    n_gpu_layers: 0
    n_threads: 0
    n_threads_batch: 0
    n_ctx: 1024
    n_batch: 512
    use_mlock: 1
    embedding: true
